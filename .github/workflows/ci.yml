name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # No real credentials in CI. The app runs on the file-store
          # fallback when FIREBASE_* vars are absent, and the voice/
          # chat paths are not exercised by the test suite. This means
          # every deterministic engine test runs as designed.
          GEMINI_API_KEY: ""
          FIREBASE_PROJECT_ID: ""
          FIREBASE_CLIENT_EMAIL: ""
          FIREBASE_PRIVATE_KEY: ""
